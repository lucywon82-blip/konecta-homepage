<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>코넥타 업무</title>
<meta name="theme-color" content="#2B3648" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
<div id="app">

  <header class="topbar">
    <span class="brand">코넥타 업무</span>
    <div class="month-nav">
      <button id="prevBtn" class="nav-btn" aria-label="이전">‹</button>
      <span id="periodLabel" class="period-label">2026년 9월</span>
      <button id="nextBtn" class="nav-btn" aria-label="다음">›</button>
    </div>
    <button id="todayBtn" class="today-btn">오늘</button>
  </header>

  <div id="viewToggle" class="view-toggle">
    <button data-mode="month" class="toggle-btn active">월간</button>
    <button data-mode="week" class="toggle-btn">주간</button>
  </div>

  <main id="mainArea">

    <section id="calendarView" class="view active">
      <div class="weekday-row">
        <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
      </div>
      <div id="calendarGrid" class="calendar-grid month"></div>

      <div class="legend">
        <span class="chip" data-cat="개인">개인</span>
        <span class="chip" data-cat="사업미팅">사업미팅</span>
        <span class="chip" data-cat="가족">가족</span>
        <span class="chip" data-cat="교육">교육</span>
        <span class="chip" data-cat="기타">기타</span>
        <span class="chip" data-cat="예약">예약</span>
      </div>
    </section>

    <section id="salesView" class="view">
      <div class="sales-total-card">
        <span class="sales-total-label">이번 기간 매출 합계</span>
        <span id="salesTotal" class="sales-total-amount">0원</span>
      </div>
      <ul id="salesByStaff" class="sales-staff-list"></ul>
      <ul id="salesList" class="sales-list"></ul>
    </section>

  </main>

  <div id="dayPanel" class="day-panel" hidden>
    <div class="day-panel-handle"></div>
    <div class="day-panel-header">
      <span id="dayPanelDate"></span>
      <button id="dayPanelClose" class="nav-btn" aria-label="닫기">✕</button>
    </div>
    <ul id="dayPanelList" class="event-list"></ul>
  </div>
  <div id="dayPanelBackdrop" class="day-panel-backdrop" hidden></div>

  <nav class="bottom-tabs">
    <button data-tab="calendar" class="tab active">
      <span class="tab-icon">📅</span><span>캘린더</span>
    </button>
    <button data-tab="sales" class="tab">
      <span class="tab-icon">💰</span><span>매출</span>
    </button>
  </nav>

</div>

<script src="js/app.js"></script>
</body>
</html>
