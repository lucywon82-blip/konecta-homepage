<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AM:ME</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="wrap">
    <span class="logo">AM:ME</span>
    <nav>
      <a href="#about">소개</a>
      <a href="#contact">문의</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>시술 받고 나면<br>뭐부터 챙길까요?</h1>
    <p class="sub">오직 당신 고유의 결에 집중하는</p>
  </div>
</section>

<section id="about" class="quote">
  <div class="wrap">
    <p class="quote-mark">"고유의 결을 찾다"</p>
    <p class="quote-sub">아름다움이 머무는 곳, 나다운 세련됨</p>
  </div>
</section>

<section id="contact" class="contact">
  <div class="wrap">
    <h2>편하신 방법으로 문의해 주세요</h2>
    <div class="contact-buttons">
      <a class="btn btn-kakao" href="#" target="_blank" rel="noopener">
        <span class="btn-title">카카오톡 문의하기</span>
        <span class="btn-desc">클릭 시 즉시 상담 가능</span>
      </a>
      <a class="btn btn-insta" href="#" target="_blank" rel="noopener">
        <span class="btn-title">인스타 문의하기</span>
        <span class="btn-desc">Instagram DM으로 문의해 주세요</span>
      </a>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="wrap">
    <p>&copy; 2026 AM:ME. All rights reserved.</p>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
