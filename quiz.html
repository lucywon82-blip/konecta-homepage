<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>피부 진단 | Konecta</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .quiz-card-wrap { max-width: 420px; margin: 0 auto; }
  .quiz-card {
    position: relative;
    width: 100%;
    background: var(--white);
    border: 2px dashed var(--coral);
    border-radius: 24px;
    box-sizing: border-box;
    padding: 34px 24px 26px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 420px;
  }
  .quiz-garland { position: absolute; top: -11px; left: 24px; right: 24px; display: flex; justify-content: space-between; pointer-events: none; }
  .quiz-topbar { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  .quiz-backbtn { display: flex; align-items: center; gap: 4px; background: none; border: none; color: var(--navy-soft); font-size: 12px; font-weight: 700; cursor: pointer; padding: 4px; visibility: hidden; font-family: inherit; }
  .quiz-backbtn.show { visibility: visible; }
  .quiz-badge { background: var(--coral-light); color: var(--coral-deep); font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 999px; white-space: nowrap; }
  .quiz-hearts-row { display: flex; gap: 5px; margin: 2px 0 4px; flex-wrap: wrap; }
  .quiz-qtitle { margin: 0; color: var(--navy); font-size: 19px; font-weight: 800; line-height: 1.4; }
  .quiz-opts { display: flex; flex-direction: column; gap: 10px; margin-top: 2px; }
  .quiz-opt { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-radius: 14px; border: 1.5px solid var(--border); color: var(--navy); font-size: 14px; font-weight: 600; cursor: pointer; background: var(--white); transition: background .12s, border-color .12s, color .12s; }
  .quiz-opt:hover { border-color: var(--coral); }
  .quiz-opt.selected { background: var(--coral-light); border-color: var(--coral); color: var(--coral-deep); font-weight: 700; }
  .quiz-opt svg { flex-shrink: 0; }
  .quiz-spacer { flex: 1; }
  .quiz-cta { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 14px; border-radius: 16px; font-size: 15px; font-weight: 800; cursor: pointer; border: none; width: 100%; font-family: inherit; }
  .quiz-cta.enabled { background: var(--coral); color: #fff; }
  .quiz-cta.disabled { background: var(--border); color: #A6ADB8; cursor: not-allowed; }
  .quiz-field { display: flex; flex-direction: column; gap: 6px; }
  .quiz-field label { color: var(--navy-soft); font-size: 12px; font-weight: 700; }
  .quiz-field input { padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--border); font-size: 14px; font-family: inherit; color: var(--navy); outline: none; }
  .quiz-field input:focus { border-color: var(--coral); }
  .quiz-errmsg { color: #D9534F; font-size: 12px; font-weight: 600; }
  .quiz-done-body { align-items: center; text-align: center; justify-content: center; }
  .quiz-done-body h2 { margin: 0; color: var(--navy); font-size: 21px; font-weight: 800; }
  .quiz-done-body p { margin: 0; color: var(--navy-soft); font-size: 13px; line-height: 1.6; }
</style>
</head>
<body>

<header class="header">
  <div class="wrap">
    <a class="logo" href="index.html">konecta</a>
    <nav>
      <a href="brand.html" data-i18n="common.nav.brand">브랜드 소개</a>
      <a href="journal.html" data-i18n="common.nav.journal">창업일기</a>
      <a href="blog/index.html" data-i18n="common.nav.blog">블로그</a>
      <a href="quiz.html" class="active" data-i18n="common.nav.quiz">피부진단</a>
      <a href="index.html#contact" data-i18n="common.nav.contact">문의</a>
      <div class="lang-switch">
        <button data-lang="ko">KO</button>
        <button data-lang="es">ES</button>
        <button data-lang="en">EN</button>
      </div>
    </nav>
  </div>
</header>

<section class="page-hero" style="min-height:auto; padding:80px 0 50px; color:var(--navy); background:var(--surface-alt); border-bottom:1px solid var(--border); text-align:center;">
  <div class="wrap">
    <span class="pill-badge light">SKIN TEST</span>
    <h1 style="margin-top:14px;" data-i18n="quiz.title">Konecta 피부 MBTI 진단</h1>
    <p class="page-hero-sub" style="color:var(--text-soft);" data-i18n="quiz.subtitle">몇 가지 질문에 답하면 나에게 맞는 K-뷰티 큐레이션 방향을 알려드려요.</p>
  </div>
</section>

<section>
  <div class="wrap quiz-card-wrap">
    <div id="quiz-app" class="quiz-card"></div>
  </div>
</section>

<section class="footer-contact">
  <div class="wrap">
    <span class="pill-badge light">CONTACT</span>
    <h2 data-i18n="contact.title">협업 · 투자 · 파트너 문의를 환영합니다</h2>
    <div class="contact-buttons">
      <a class="btn" href="https://www.instagram.com/konecta.co.kr/" target="_blank" rel="noopener">
        <span class="btn-title" data-i18n="contact.ig_t">인스타그램 DM</span>
        <span class="btn-desc" data-i18n="contact.ig_d">고객·일반 문의는 이쪽으로 편하게 남겨주세요</span>
      </a>
      <a class="btn" href="mailto:lucywon82@gmail.com">
        <span class="btn-title" data-i18n="contact.mail_t">이메일 문의</span>
        <span class="btn-desc" data-i18n="contact.mail_d">브랜드 협업 · 파트너십 문의는 이메일로</span>
      </a>
    </div>
    <p class="copyright" data-i18n="common.footer.copyright">&copy; 2026 Konecta. All rights reserved.</p>
  </div>
</section>

<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
<script>
var FIELD_IDS = ["country", "ageGroup", "contactMethod", "awarenessChannel", "kbeautyExperience", "skinType", "routineStyle", "budget", "firstPurchasePref", "routineTime"];
// Canonical Korean option text per question (by FIELD_IDS order), used only when
// building the payload sent to Notion — so answers stay in one consistent language
// in the database no matter which UI language the visitor answered in.
var KO_OPTIONS = [
  ["페루", "칠레", "기타 남미 국가", "남미 외 지역"],
  ["10대", "20대", "30대", "40대", "50대 이상"],
  ["인스타그램 DM", "왓츠앱", "이메일", "기타"],
  ["인스타그램", "틱톡", "유튜브", "홈페이지", "지인 추천", "기타"],
  ["자주 사용함", "가끔 사용해봄", "이번이 처음"],
  ["바로 당김 (건성)", "1~2시간 후 당김 (중성)", "안 당기고 번들거림 (지성)", "부위마다 다름 (복합성)"],
  ["미니멀 (토너+로션 정도)", "기본 케어 (토너+에센스+크림)", "풀코스 케어 (에센스+세럼+크림+팩까지)"],
  ["20달러 이하", "20~50달러", "50~100달러", "100달러 이상"],
  ["미니·트래블 사이즈로 먼저 테스트", "바로 정품 사이즈로 구매", "상관없음"],
  ["5분 이내 초간단 루틴", "10~15분 기본 루틴", "20분 이상 정성 케어"]
];
var SUBMITTING_TEXT = { ko: "제출 중...", es: "Enviando...", en: "Submitting..." };
var ERR_REQUIRED = { ko: "이름과 연락처를 모두 입력해주세요", es: "Completa tu nombre y tu contacto", en: "Please fill in both your name and contact" };
var ERR_SUBMIT = { ko: "제출 중 문제가 발생했어요. 잠시 후 다시 시도해주세요.", es: "Hubo un problema al enviar. Intenta de nuevo en un momento.", en: "Something went wrong submitting. Please try again shortly." };

var QUESTIONS = [];
var TOTAL = 0;
var CONTACT_STEP = 0;
var DONE_STEP = 0;
var quizStrings = null;
var currentLang = "ko";

var state = { step: 0, answers: {}, answerIdx: {}, name: "", contact: "", error: "", submitting: false };

function buildQuestions(data) {
  var qList = (data && data.quiz && data.quiz.questions) || [];
  return FIELD_IDS.map(function (id, i) {
    var q = qList[i] || { question: "", options: [] };
    return { id: id, title: q.question, options: q.options };
  });
}

function heartIcon(size, fill) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.1C0.4 8.8 2 5 6 5c2 0 3.5 1.2 4 2.5C10.5 6.2 12 5 14 5c4 0 5.6 3.8 4 6.9C19.5 16.4 12 21 12 21z" fill="' + fill + '"/></svg>';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function garlandHtml() {
  var out = "";
  for (var i = 0; i < 7; i++) out += heartIcon(13, "#ED7B5D");
  return out;
}

function progressHtml(activeCount) {
  var out = "";
  for (var i = 0; i < TOTAL; i++) {
    out += heartIcon(11, i < activeCount ? "#ED7B5D" : "#E4E7EC");
  }
  return '<div class="quiz-hearts-row">' + out + '</div>';
}

function render() {
  if (!quizStrings) return;
  var app = document.getElementById("quiz-app");
  var html = "";

  if (state.step < TOTAL) {
    var q = QUESTIONS[state.step];
    var selected = state.answers[q.id];
    html += '<div class="quiz-garland">' + garlandHtml() + '</div>';
    html += '<div class="quiz-topbar">';
    html += '<button class="quiz-backbtn' + (state.step > 0 ? ' show' : '') + '" data-action="back">'
      + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="#5B6472" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' + escapeHtml(quizStrings.backButton) + '</button>';
    html += '<span class="quiz-badge">' + escapeHtml(quizStrings.progressLabel) + ' · Q' + (state.step + 1) + '/' + TOTAL + '</span>';
    html += '</div>';
    html += progressHtml(state.step);
    html += '<h2 class="quiz-qtitle">' + escapeHtml(q.title) + '</h2>';
    html += '<div class="quiz-opts">';
    q.options.forEach(function (opt, idx) {
      var isSel = selected === opt;
      html += '<div class="quiz-opt' + (isSel ? ' selected' : '') + '" data-action="select" data-qid="' + q.id + '" data-idx="' + idx + '" data-opt="' + escapeHtml(opt) + '">'
        + heartIcon(14, isSel ? "#ED7B5D" : "#E4E7EC") + '<span>' + escapeHtml(opt) + '</span></div>';
    });
    html += '</div>';
    html += '<div class="quiz-spacer"></div>';
    html += '<button class="quiz-cta ' + (selected ? "enabled" : "disabled") + '" data-action="next" ' + (selected ? "" : "disabled") + '>' + escapeHtml(quizStrings.nextButton) + heartIcon(13, "#fff") + '</button>';
  } else if (state.step === CONTACT_STEP) {
    var fs = quizStrings.finalStep;
    html += '<div class="quiz-garland">' + garlandHtml() + '</div>';
    html += '<div class="quiz-topbar">';
    html += '<button class="quiz-backbtn show" data-action="back">'
      + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="#5B6472" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' + escapeHtml(quizStrings.backButton) + '</button>';
    html += '<span class="quiz-badge">' + escapeHtml(fs.stepLabel) + '</span>';
    html += '</div>';
    html += progressHtml(TOTAL);
    html += '<h2 class="quiz-qtitle">' + escapeHtml(fs.title) + '</h2>';
    html += '<div class="quiz-field"><label>' + escapeHtml(fs.nameLabel) + '</label><input id="nameInput" type="text" value="' + escapeHtml(state.name) + '"></div>';
    html += '<div class="quiz-field"><label>' + escapeHtml(fs.contactLabel) + '</label><input id="contactInput" type="text" placeholder="@konecta.co.kr" value="' + escapeHtml(state.contact) + '"></div>';
    if (state.error) html += '<div class="quiz-errmsg">' + escapeHtml(state.error) + '</div>';
    html += '<div class="quiz-spacer"></div>';
    html += '<button class="quiz-cta enabled" data-action="submit">' + (state.submitting ? escapeHtml(SUBMITTING_TEXT[currentLang] || SUBMITTING_TEXT.ko) : escapeHtml(fs.submitButton)) + heartIcon(13, "#fff") + '</button>';
  } else {
    var fs2 = quizStrings.finalStep;
    html += '<div class="quiz-done-body" style="display:flex; flex-direction:column; gap:16px;">';
    html += heartIcon(46, "#ED7B5D");
    html += '<h2>' + escapeHtml(fs2.thanksTitle) + '</h2>';
    html += '<p>' + escapeHtml(fs2.thanksDescription) + '</p>';
    html += '</div>';
  }

  app.innerHTML = html;
  attachHandlers();
}

function attachHandlers() {
  var app = document.getElementById("quiz-app");
  var opts = app.querySelectorAll('[data-action="select"]');
  opts.forEach(function (el) {
    el.addEventListener("click", function () {
      state.answers[el.getAttribute("data-qid")] = el.getAttribute("data-opt");
      state.answerIdx[el.getAttribute("data-qid")] = parseInt(el.getAttribute("data-idx"), 10);
      render();
    });
  });
  var back = app.querySelector('[data-action="back"]');
  if (back) back.addEventListener("click", function () { if (state.step > 0) { state.step--; render(); } });
  var next = app.querySelector('[data-action="next"]');
  if (next) next.addEventListener("click", function () {
    var q = QUESTIONS[state.step];
    if (!state.answers[q.id]) return;
    state.step++;
    render();
  });
  var submitBtn = app.querySelector('[data-action="submit"]');
  if (submitBtn) submitBtn.addEventListener("click", handleSubmit);
  var nameInput = document.getElementById("nameInput");
  if (nameInput) nameInput.addEventListener("input", function (e) { state.name = e.target.value; });
  var contactInput = document.getElementById("contactInput");
  if (contactInput) contactInput.addEventListener("input", function (e) { state.contact = e.target.value; });
}

function handleSubmit() {
  if (!state.name.trim() || !state.contact.trim()) {
    state.error = ERR_REQUIRED[currentLang] || ERR_REQUIRED.ko;
    render();
    return;
  }
  state.error = "";
  state.submitting = true;
  render();

  var canonicalAnswers = {};
  FIELD_IDS.forEach(function (id, i) {
    var idx = state.answerIdx[id];
    var opts = KO_OPTIONS[i];
    canonicalAnswers[id] = (typeof idx === "number" && opts[idx] !== undefined) ? opts[idx] : state.answers[id];
  });
  var payload = Object.assign({ name: state.name, contact: state.contact, lang: currentLang }, canonicalAnswers);

  fetch('/.netlify/functions/submit-quiz', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  })
    .then(function (res) {
      if (!res.ok) throw new Error('submit failed');
      state.submitting = false;
      state.step = DONE_STEP;
      render();
    })
    .catch(function () {
      state.submitting = false;
      state.error = ERR_SUBMIT[currentLang] || ERR_SUBMIT.ko;
      render();
    });
}

document.addEventListener('konecta:i18n', function (e) {
  currentLang = e.detail.lang;
  quizStrings = e.detail.data.quiz;
  QUESTIONS = buildQuestions(e.detail.data);
  TOTAL = QUESTIONS.length;
  CONTACT_STEP = TOTAL;
  DONE_STEP = TOTAL + 1;
  render();
});
</script>
</body>
</html>
